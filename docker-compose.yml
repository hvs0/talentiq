services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - "./[PUB] India_runs_data_and_ai_challenge/[PUB] India_runs_data_and_ai_challenge/India_runs_data_and_ai_challenge:/data"
      - "./backend/talentiq.db:/app/talentiq.db"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
